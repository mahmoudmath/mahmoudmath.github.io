    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection Année - Examens</title>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
    /* ===== STYLE LOCAL - PAGE CHOIX EXAMENS (décor amélioré) ===== */

    :root {
        --bleu: #003366;
        --bleu-clair: #0b4f94;
        --bleu-pale: #eaf2fb;
        --or: #c9a227;
        --jaune: #ffc107;
        --texte-doux: #5b6b7f;
        --bordure: #d9e3ef;
    }

    /* FOND : papier quadrillé très discret */
    body {
        background-color: #f5f8fc;
        background-image:
            linear-gradient(rgba(0,51,102,0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,51,102,0.045) 1px, transparent 1px);
        background-size: 28px 28px;
    }

    /* EN-TÊTE : dégradé bleu, quadrillage et filet doré */
    .professor-header {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 85% 20%, rgba(255,255,255,0.14), transparent 45%),
            linear-gradient(135deg, #002a55 0%, var(--bleu) 45%, var(--bleu-clair) 100%);
        padding: 56px 20px 52px;
        border-radius: 14px;
        margin-bottom: 30px;
        text-align: center;
        border-bottom: 4px solid var(--jaune);
        box-shadow: 0 12px 30px rgba(0,51,102,0.22);
    }

    .professor-header::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
        background-size: 32px 32px;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 90%);
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 90%);
        pointer-events: none;
    }

    /* Symbole mathématique en filigrane */
    .professor-header::after {
        content: "Σ";
        position: absolute;
        right: 4%;
        bottom: -38px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 12rem;
        line-height: 1;
        color: rgba(255,255,255,0.08);
        pointer-events: none;
    }

    .header-content {
        position: relative;
        z-index: 1;
    }

    .professor-name {
        color: white !important;
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin-bottom: 14px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.25);
    }

    .professor-title {
        display: inline-block;
        color: white !important;
        font-size: 1.1rem;
        font-style: italic;
        opacity: 0.95;
        padding: 6px 18px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
    }

    /* BLOC DE PRÉSENTATION : panneau blanc */
    .presentation {
        background: rgba(255,255,255,0.92);
        padding: 36px 32px 32px;
        border-radius: 16px;
        border: 1px solid var(--bordure);
        box-shadow: 0 10px 30px rgba(0,51,102,0.08);
    }

    /* TITRE "Annales disponibles" */
    h3 {
        color: var(--bleu);
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 30px;
        padding-bottom: 16px;
        position: relative;
    }

    h3::after {
        content: "";
        display: block;
        width: 64px;
        height: 3px;
        margin: 14px auto 0;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--bleu), var(--jaune));
    }

    /* BOUTONS ANNÉES - CARTES AVEC BARRE LATÉRALE */
    .nav-card {
        position: relative;
        display: block;
        background: white;
        color: var(--bleu);
        padding: 20px 56px 20px 28px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 1.2rem;
        font-weight: 600;
        border: 1px solid var(--bordure);
        box-shadow: 0 4px 10px rgba(0,51,102,0.05);
        transition: all 0.3s ease;
    }

    /* Chevron à droite */
    .nav-card::after {
        content: "›";
        position: absolute;
        right: 22px;
        top: 50%;
        transform: translateY(-52%);
        font-size: 1.8rem;
        font-weight: 400;
        color: var(--bleu);
        opacity: 0.35;
        transition: all 0.3s ease;
    }

    .nav-card:hover {
        background: #fffbea;
        border-color: var(--bleu);
        transform: translateY(-3px);
        box-shadow: 0 12px 22px rgba(0,51,102,0.14);
    }

    .nav-card:hover::after {
        opacity: 1;
        right: 16px;
    }

    .nav-card:focus-visible {
        outline: 3px solid var(--jaune);
        outline-offset: 3px;
    }

    /* BOUTONS EXAMENS - Accent jaune (une teinte par année) */
    .nav-card[href*="examens"] {
        border-left: 6px solid var(--jaune);
    }

    .nav-card[href*="examens-24-25"] {
        border-left-color: #ffe08a;
    }

    .nav-card[href*="examens-25-26"] {
        border-left-color: var(--jaune);
    }

    .nav-card[href*="examens"]:hover {
        border-left-color: var(--jaune);
    }

    /* BOUTON RETOUR (plus discret) */
    .nav-card[href*="pedagogie"] {
        color: var(--texte-doux);
        border-color: #dee2e6;
        border-left: 1px solid #dee2e6;
        background: transparent;
        box-shadow: none;
        font-size: 1rem;
        padding: 14px 25px;
    }

    .nav-card[href*="pedagogie"]::after {
        content: none;
    }

    .nav-card[href*="pedagogie"]:hover {
        background: #f8f9fa;
        border-color: #6c757d;
        border-left-color: #6c757d;
        color: #495057;
        box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .professor-header {
            padding: 40px 16px 38px;
        }

        .professor-header::after {
            font-size: 8rem;
            bottom: -24px;
        }

        .professor-name {
            font-size: 1.8rem;
        }

        .professor-title {
            font-size: 0.95rem;
        }

        .presentation {
            padding: 26px 18px 22px;
        }

        h3 {
            font-size: 1.2rem;
        }

        .nav-card {
            padding: 16px 48px 16px 20px;
            font-size: 1.1rem;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .nav-card, .nav-card::after { transition: none; }
        .nav-card:hover { transform: none; }
    }
    </style>

        <div class="presentation" style="max-width: 600px; margin: 40px auto; text-align: center;" data-aos="zoom-in">

            <div style="display: flex; flex-direction: column; gap: 20px;">
                <a href="examens-24-25.html" class="nav-card">📅 Année 2024 - 2025</a>
                <a href="examens-25-26.html" class="nav-card">📅 Année 2025 - 2026</a>
                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e7ef;">
                    <a href="pedagogie.html" class="nav-card">⬅ RETOUR</a>
                </div>
            </div>
